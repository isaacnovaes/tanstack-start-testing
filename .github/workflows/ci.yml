name: CI

on:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            # The build and the tests do not connect. src/server/env.ts only needs a value.
            DATABASE_URL: postgres://user:password@localhost:5432/app
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm exec playwright install --with-deps chromium

            - run: pnpm typecheck

            - run: pnpm lint

            - run: pnpm check

            - run: pnpm test

            - run: pnpm build
